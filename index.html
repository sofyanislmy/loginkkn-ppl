<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Mahasiswa KKN-PPL</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)),
        url('https://images.unsplash.com/photo-1549887534-1585f682efac') no-repeat center center fixed;
      background-size: cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 15px;
      width: 100%;
      max-width: 350px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .login-container h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
      color: #333;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #aaa;
      border-radius: 8px;
    }

    .form-group button {
      width: 100%;
      padding: 10px;
      background-color: #2e8b57;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .form-group button:hover {
      background-color: #246b45;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login Mahasiswa KKN-PPL</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" required />
      </div>
      <div class="form-group">
        <label for="npm">NPM</label>
        <input type="text" id="npm" name="npm" required />
      </div>
      <div class="form-group">
        <button type="submit">Login</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();

      const nama = document.getElementById("nama").value.trim();
      const npm = document.getElementById("npm").value.trim();

      if (nama && npm) {
        // Redirect ke Google Sites
        window.location.href = "https://sites.google.com/view/informasi-mahasiswa-kkn-ppl/data-mahasiswa";
      } else {
        alert("Mohon lengkapi nama dan NPM.");
      }
    });
  </script>
</body>
</html>
