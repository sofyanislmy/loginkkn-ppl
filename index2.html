<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Login Mahasiswa KKN-PPL</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: sans-serif;
      background: url('https://i.ibb.co/YkwW4pv/desa-indonesia.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      height: 100dvh; /* fix untuk scroll di mobile */
      justify-content: center;
      align-items: center;
    }
    .login-box {
      background: rgba(255, 255, 255, 0.15);
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      width: 100%;
      max-width: 400px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    input:focus {
      outline: none;
      border-color: #007bff;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 12px;
      text-align: center;
      font-weight: bold;
      color: white;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    @media (max-width: 480px) {
      .login-box {
        margin: 0 10px;
        padding: 20px 15px;
      }
      h2 {
        font-size: 18px;
      }
      input, button {
        padding: 10px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login Mahasiswa KKN-PPL</h2>
    <input type="text" id="nama" placeholder="Masukkan Nama" required>
    <input type="number" id="npm" placeholder="Masukkan NPM" required>
    <button onclick="login()">Login</button>
    <p id="status"></p>
  </div>

  <script>
    async function login() {
      const nama = document.getElementById("nama").value.trim();
      const npm = document.getElementById("npm").value.trim();
      const statusText = document.getElementById("status");

      if (!nama || !npm) {
        statusText.innerText = "Silakan isi Nama dan NPM!";
        return;
      }

      try {
        const url = `https://script.google.com/macros/s/AKfycbzIjbb8-gqQduHyFO47PcK0OYhe_ZV6sTcbgCazcQ8o366bN_Nb9-A3xkpKgGGpnlph/exec?nama=${encodeURIComponent(nama)}&npm=${encodeURIComponent(npm)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.status === "success") {
  statusText.innerText = "Login berhasil! Mengalihkan...";
  setTimeout(() => {
    window.location.href = "https://sites.google.com/d/192mhXZbR1BJvpshCMtXlnaw8p9J0vvWW/p/1aHfM9AhA072w_GKEpLBNnIaTOJotX4ND/edit";
  }, 1500);
} else {
          statusText.innerText = "Login gagal. Nama atau NPM tidak cocok.";
        }
      } catch (error) {
        statusText.innerText = "Terjadi kesalahan. Coba lagi.";
      }
    }
  </script>
</body>
</html>
